<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>game</title>
<style>
	html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 12px monospace; overflow: hidden; }
	#canvas { display: block; position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; background: #000; }

	@font-face { font-family: 'Chalet'; src: url('/b/8b0b5899ed/title/chalet.woff') format('woff'); }
	#loading { position: fixed; inset: 0; background: #000; overflow: hidden; transition: opacity .8s; z-index: 5; }
	#loading.done { opacity: 0; pointer-events: none; }
	#ls-stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; font: 12px Chalet, sans-serif; color: #fff; }
	#ls-screens { position: absolute; inset: 0; }
	.ls-screen { position: absolute; inset: 0; }


	.ls-cam { position: absolute; inset: 0; perspective: 1229px; perspective-origin: 640px 360px; }
	.ls-layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; background-size: 100% 100%; }
	#ls-logo { position: absolute; left: 95px; top: 492.5px; width: 186px; height: 186px; }
	#ls-bars { position: absolute; right: 96px; top: 642px; display: flex; gap: 3px; }
	.ls-bar { height: 24px; padding: 0 6px; display: flex; align-items: center; background: rgba(0, 0, 0, .706); border-radius: 2.4px; white-space: nowrap; }
	#modes { gap: 8px; }
	#modes button { display: flex; align-items: center; height: 24px; padding: 0; border: 0; background: none; color: #fff; font: 12px Chalet, sans-serif; cursor: pointer; }
	#modes button:disabled { cursor: default; }
	#modes button[hidden] { display: none; }
	#modes.ask button:not(:disabled) .ls-key { animation: ls-ask 1.2s ease-in-out infinite; }
	@keyframes ls-ask { 50% { opacity: .35; } }
	.ls-key { margin-left: 4px; min-width: 12px; height: 15px; padding: 0 4px; line-height: 16px; border-radius: 2px; background: #fff; color: #000; font-size: 10px; text-transform: uppercase; }
	.ls-spin { flex: none; width: 22px; height: 22px; margin-left: 2px; background: url('/b/8b0b5899ed/title/spinner.png') center / 24px 24px no-repeat; animation: ls-spin 2s steps(60) infinite; }
	@keyframes ls-spin { from { transform: rotate(0deg) scaleX(-1); } to { transform: rotate(-360deg) scaleX(-1); } }

	#ls-log { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex; flex-direction: column; align-items: center; font: 10px/1.35 Consolas, monospace; color: rgba(190, 190, 190, .75); text-shadow: 0 0 2px #000, 1px 1px 1px #000; white-space: pre; pointer-events: none; }
	#console { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
	#data { color: #6a9; }
	#bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .08); }
	#fill { height: 100%; width: 0; background: #7cc576; }

	#fps { position: fixed; left: 8px; top: 6px; display: none; color: #0f0; font: bold 18px/1.2 Consolas, monospace; font-variant-numeric: tabular-nums; text-shadow: 1px 1px 2px #000, 0 0 3px #000; pointer-events: none; z-index: 10; }
	#iso { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, .82); z-index: 20; }
	#iso.show { display: flex; }
	#iso-box { max-width: 520px; margin: 16px; padding: 20px 22px; background: #17181c; border: 1px solid #333; border-radius: 8px; box-shadow: 0 12px 40px #000c; font: 13px/1.5 Consolas, monospace; color: #ddd; }
	#iso-box h2 { margin: 0 0 10px; font: 15px Chalet, sans-serif; color: #e66; }
	#iso-box p { margin: 0 0 12px; }
	#iso-box code { color: #7cc576; word-break: break-all; }
	#iso-url { display: block; width: 100%; box-sizing: border-box; margin: 0 0 10px; padding: 8px 10px; background: #0b0b0e; border: 1px solid #333; border-radius: 4px; color: #7cc576; font: 13px Consolas, monospace; }
	#iso-box .row { display: flex; align-items: center; gap: 10px; }
	#iso-copy { padding: 7px 14px; border: 0; border-radius: 4px; background: #3a7d44; color: #fff; font: 12px Chalet, sans-serif; cursor: pointer; }
	#iso-copy:active { background: #2f6537; }
	#iso-hint { margin: 12px 0 0; color: #999; font-size: 11px; }
	#iso-close { position: absolute; right: 14px; top: 10px; border: 0; background: none; color: #888; font: 22px/1 Consolas, monospace; cursor: pointer; }

	#gfx { position: fixed; left: 8px; top: 30px; z-index: 15; font: 13px/1.5 'Segoe UI', Tahoma, sans-serif; }
	#gfx-toggle { display: flex; flex-direction: column; justify-content: center; gap: 4px; width: 40px; height: 34px; padding: 0 9px; border: 1px solid #444; border-radius: 6px; background: linear-gradient(#24252b, #17181c); cursor: pointer; }
	#gfx-toggle span { display: block; width: 100%; height: 3px; border-radius: 2px; background: #7cc576; }
	#gfx-toggle:hover { border-color: #3a7d44; background: linear-gradient(#2a2b31, #1b1c21); }
	#gfx-toggle:hover span { background: #9ad693; }
	#gfx-toggle:active { background: #121317; }
	#gfx-panel { width: 268px; max-height: calc(100vh - 120px); overflow: auto; margin-top: 6px; padding: 12px 14px; background: #17181c; border: 1px solid #333; border-radius: 8px; box-shadow: 0 12px 40px #000c; color: #ddd; }
	#gfx-panel[hidden] { display: none; }
	.gfx-row { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; }
	.gfx-row label { flex: 0 0 96px; color: #bbb; }
	.gfx-row input[type=range] { flex: 1 1 auto; min-width: 0; height: 3px; margin: 6px 0; appearance: none; background: #333; border-radius: 2px; accent-color: #3a7d44; }
	.gfx-row input[type=range]::-webkit-slider-thumb { appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #7cc576; cursor: pointer; }
	.gfx-row input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: #7cc576; cursor: pointer; }
	.gfx-row output { flex: 0 0 44px; text-align: right; color: #7cc576; font-variant-numeric: tabular-nums; }
	#gfx-panel .btns { display: flex; gap: 8px; margin-top: 12px; }
	#gfx-panel button { padding: 6px 12px; border: 0; border-radius: 4px; background: #3a7d44; color: #fff; font: 12px 'Segoe UI', Tahoma, sans-serif; cursor: pointer; }
	#gfx-panel button.ghost { background: #2a2b31; }
	#gfx-panel button:active { background: #2f6537; }
	#save-import { margin-top: 14px; padding-top: 10px; border-top: 1px solid #333; }
	#save-import h3 { margin: 0 0 7px; color: #ddd; font-size: 13px; font-weight: 600; }
	.save-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
	.save-row label { flex: 0 0 70px; color: #bbb; }
	.save-row input { min-width: 0; box-sizing: border-box; flex: 1; padding: 5px 6px; background: #0b0b0e; border: 1px solid #444; border-radius: 4px; color: #ddd; font: 11px 'Segoe UI', sans-serif; }
	#save-file { width: 100%; margin: 4px 0; color: #bbb; font: 11px 'Segoe UI', sans-serif; }
	#save-list { max-height: 120px; overflow: auto; margin: 5px 0; border: 1px solid #333; border-radius: 4px; }
	.save-entry { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 7px; border-bottom: 1px solid #292a2e; color: #aaa; font-size: 11px; }
	.save-entry:last-child { border-bottom: 0; }
	.save-entry button { padding: 3px 7px !important; }
	#save-empty { padding: 7px; color: #888; font-size: 11px; }
	#save-status { min-height: 16px; margin-top: 5px; color: #9ad693; font-size: 11px; }
</style>
</head>
<body>
<canvas id="canvas" width="800" height="600" tabindex="-1"></canvas>
<div id="hud"></div>
<div id="loading"><div id="ls-stage"><div id="ls-screens"></div><img id="ls-logo" src="/b/8b0b5899ed/title/logo.png" alt=""><div id="ls-bars"><div id="modes" class="ls-bar"><button data-act="back"></button><button data-act="map5"></button><button data-act="map6"></button><button data-act="sandbox"></button><button data-act="story"></button></div><div class="ls-bar"><span id="label">Starting...</span><span id="pct">0%</span><i class="ls-spin"></i></div></div></div><div id="ls-log"><div id="data"></div><div id="console"></div></div><div id="bar"><div id="fill"></div></div></div>
<div id="fps"></div>
<div id="gfx">
	<button id="gfx-toggle" type="button" title="Graphics settings" aria-label="Graphics settings"><span></span><span></span><span></span></button>
	<div id="gfx-panel" hidden>
		<div id="gfx-rows"></div>
		<div class="btns"><button id="gfx-apply">Apply &amp; Reload</button><button id="gfx-reset" class="ghost">Reset</button><button id="gfx-close" class="ghost">Close</button></div>
		<div class="btns"><button id="gfx-fps" class="ghost">Show FPS</button><button id="gfx-full" class="ghost">Fullscreen</button></div>
		<div id="save-import">
			<h3>Load custom save</h3>
			<div class="save-row"><label>Stored saves</label><button id="save-refresh" type="button" class="ghost">Refresh</button></div>
			<div id="save-list" aria-live="polite"><div id="save-empty">Checking saved slots…</div></div>
			<input id="save-file" type="file" aria-label="Choose a GTA V save file">
			<div class="save-row"><label for="save-title-dir">Title folder</label><input id="save-title-dir" value="GTA V" spellcheck="false"></div>
			<div class="save-row"><label for="save-slot">Save slot</label><input id="save-slot" type="number" min="0" max="9999" value="0"></div>
			<button id="save-load" type="button">Import &amp; Reload</button>
			<div id="save-status" role="status"></div>
		</div>
	</div>
</div>
<div id="iso"><button id="iso-close" title="close">&times;</button><div id="iso-box">
	<h2>This page is not cross-origin isolated</h2>
	<p>The game needs <code>SharedArrayBuffer</code>, which browsers only allow on a <b>secure origin</b>. Plain <code>http:
	<p>Open this page on your phone or another device using the address below:</p>
	<input id="iso-url" readonly>
	<div class="row"><button id="iso-copy">Copy address</button><span id="iso-copy-msg" style="color:#7cc576"></span></div>
	<p id="iso-hint"></p>
</div></div>
<script type="module">



const q = new URLSearchParams(location.search);


const BASE = '/b/8b0b5899ed'.charAt(0) === '_' ? '' : '/b/8b0b5899ed';


const remoteLog = q.get('log') === '1';
const postLog = (text) => { if (remoteLog) fetch('/log', { method: 'POST', body: text }).catch(() => {}); };


{
	let posted = 0;
	new BroadcastChannel('game-crash').onmessage = (ev) => {
		const m = ev.data;
		const memory = /memory|OOM|Aborted\(|RangeError|grow/i.test(m.text);
		const dev = ' deviceMemory ' + (navigator.deviceMemory || '?') + ' GB, cores ' + navigator.hardwareConcurrency;
		if (remoteLog && posted++ < 3) fetch('/log', { method: 'POST', body: '[page] CRASH (' + m.kind + ', ' + m.thread + ' thread, wasm heap ' + m.heap + ' MB,' + dev + ', ' + location.search + '): ' + m.text + '\n' + m.tail.join('\n') + '\n' }).catch(() => {});
		const el = document.getElementById('hud');
		if (el) { el.textContent = 'The game stopped (' + m.kind + '): ' + m.text.split('\n')[0].slice(0, 200) + (memory ? ' - this looks like a lack of memory: close other tabs and reload.' : ' - reload the page.'); el.style.color = '#f96'; }
	};
}








let stopTitle = () => {};
{
	const stage = document.getElementById('ls-stage'), holder = document.getElementById('ls-screens');
	const fit = () => {
		const s = Math.min(innerWidth / 1280, innerHeight / 720);
		stage.style.transform = 'translate(' + (innerWidth - 1280 * s) / 2 + 'px,' + (innerHeight - 720 * s) / 2 + 'px) scale(' + s + ')';
	};
	fit();
	addEventListener('resize', fit);
	const L = (tex, w, h, x, y, yr, to) => ({ tex, w, h, x, y, yr, to });
	const BG = (n, yr, to, x = 98) => L('ls' + n + '_background', 1024, 512, x, 95, yr, to);
	const FG = (n, name, w, h, x, y, toX, yr = 0) => L('ls' + n + '_' + name, w, h, x, y, yr, { x: toX });
	const SCREENS = [
		[L('beach_bg', 1024, 512, 98, 95, 20, { yr: -6, xr: 5 }), L('beach_fg', 343, 629, 480, 95, 0, { x: 720 })],
		null,
		[BG(0, 7, { yr: -7 }), FG(0, 'foreground', 299, 599, 360, 140, 560, 7)],
		[BG(1, 6, { yr: -12 }), FG(1, 'foreground', 503, 206, 300, 465, 480), FG(1, 'foreground_franklin', 368, 588, 440, 140, 745)],
		[BG(2, 7, { yr: -5, xr: 5 }), FG(2, 'foreground', 311, 558, 745, 200, 450), FG(2, 'foreground_chop', 320, 512, 640, 260, 310)],
		[BG(3, 12, { yr: -4 }, 110), FG(3, 'foreground', 412, 609, 440, 120, 730)],
		[BG(4, 7, { yr: -4, xr: 5 }), FG(4, 'foreground', 251, 643, 400, 85, 250)],
		[BG(5, 7, { yr: -6 }), FG(5, 'foreground', 389, 640, 450, 95, 700)],
		[BG(6, 7, { yr: 0, xr: 5 }), FG(6, 'foreground', 367, 603, 410, 115, 800)],
		[BG(7, 6, { yr: -6, xr: 5 }), FG(7, 'foreground', 311, 625, 860, 95, 520)],
		[BG(8, 7, { yr: -5, xr: 5 }), FG(8, 'foreground', 492, 497, 400, 190, 660)],
		[BG(9, 7, { yr: -3, xr: 5 }), FG(9, 'foreground', 331, 675, 220, 50, 140)],
		[BG(10, 6, { yr: -5, xr: 5 }), FG(10, 'foreground', 352, 682, 545, 65, 485)],
		[BG(11, 7, { yr: -3, xr: 5 }), FG(11, 'foreground', 344, 669, 309, 51, 424)],
		[BG(12, 6, { yr: -4 }), FG(12, 'foreground_michael', 462, 677, 345, 42, 220)],
		[BG(13, 5, { yr: -6, xr: 5 }), FG(13, 'foreground', 399, 681, 430, 39, 250)],
		[BG(14, 6, { yr: -2, xr: 5 }), FG(14, 'foreground', 392, 631, 650, 95, 850)],
		[BG(15, 6, { yr: -3, xr: 5 }), FG(15, 'foreground', 385, 642, 404, 78, 261)],
		[BG(16, 6, { yr: -3, xr: 5 }), FG(16, 'foreground', 300, 600, 300, 150, 400)],
	];
	const ORDERS = [[0, 16, 18, 3, 12, 2, 17, 10, 9, 8, 15, 6, 11, 14, 4, 7, 13], [0, 4, 6, 17, 11, 16, 18, 7, 9, 15, 3, 14, 10, 13, 2, 8, 12],
		[0, 7, 16, 14, 13, 3, 10, 2, 15, 18, 8, 9, 4, 17, 12, 6, 11], [0, 8, 18, 9, 13, 4, 11, 14, 7, 17, 6, 12, 3, 16, 2, 15, 10],
		[0, 11, 12, 7, 18, 14, 9, 13, 4, 2, 15, 11, 8, 16, 6, 3, 17], [0, 10, 16, 2, 13, 17, 8, 9, 18, 3, 12, 6, 7, 4, 14, 15, 10]];
	const order = ORDERS[Math.floor(Math.random() * ORDERS.length)];
	const cubicInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(2 - 2 * t, 3) / 2);

	const slide = (s, x) => {
		s.el.style.transform = 'translateX(' + x + 'px)';
		for (const c of s.cams) c.style.perspectiveOrigin = (640 - x) + 'px 360px';
	};
	const place = (l, x, yr, xr) => { l.el.style.transform = 'translate3d(' + x + 'px,' + l.y + 'px,0) rotateY(' + -yr + 'deg) rotateX(' + -xr + 'deg)'; };

	const prepare = (i) => {
		const layers = SCREENS[order[i]].map((d) => ({ ...d, img: Object.assign(new Image(), { src: '/b/8b0b5899ed/title/art/' + d.tex + '.webp' }) }));
		return Promise.all(layers.map((l) => l.img.decode().catch(() => {}))).then(() => layers);
	};
	let active = null, leaving = null, index = 0, alt = -1, timer = 0, raf = 0, stopped = false;
	const show = (defs) => {
		const now = performance.now();
		alt = alt <= 0 ? 1 : -1;
		const el = document.createElement('div');
		el.className = 'ls-screen';
		const cams = [];
		const s = { el, slideFrom: alt * 1280, start: now, settled: 0, cams, layers: defs.map((d) => {
			const cam = document.createElement('div'), e = document.createElement('div');
			cam.className = 'ls-cam';
			e.className = 'ls-layer';
			e.style.width = d.w + 'px'; e.style.height = d.h + 'px';
			e.style.backgroundImage = 'url(' + d.img.src + ')';
			cam.appendChild(e);
			el.appendChild(cam);
			cams.push(cam);
			return { el: e, y: d.y, x0: d.x, yr0: d.yr, xr0: 0, x1: d.to.x ?? d.x, yr1: d.to.yr ?? d.yr, xr1: d.to.xr ?? 0 };
		}) };
		for (const l of s.layers) place(l, l.x0, l.yr0, l.xr0);
		slide(s, s.slideFrom);
		holder.appendChild(el);
		if (leaving) leaving.el.remove();
		leaving = active;
		if (leaving) { leaving.slideFrom = 0; leaving.slideTo = -alt * 1280; leaving.start = now; }
		active = s;
		s.slideTo = 0;
	};
	const tick = (now) => {
		for (const s of [leaving, active]) {
			if (!s) continue;
			const p = Math.min(1, (now - s.start) / 850);
			if (p < 1 || !s.slid) { slide(s, s.slideFrom + (s.slideTo - s.slideFrom) * cubicInOut(p)); s.slid = p === 1; }
			if (s === active && p === 1 && !s.settled) s.settled = now;
			if (s.settled) {
				const q = Math.min(1, (now - s.settled) / 42000);
				for (const l of s.layers) place(l, l.x0 + (l.x1 - l.x0) * q, l.yr0 + (l.yr1 - l.yr0) * q, l.xr0 + (l.xr1 - l.xr0) * q);
			}
			if (s === leaving && p === 1) { s.el.remove(); leaving = null; }
		}
		if (!stopped) raf = requestAnimationFrame(tick);
	};
	let next = prepare(0);
	const cycle = () => next.then((defs) => {
		if (stopped) return;
		show(defs);
		index = (index + 1) % order.length;
		next = prepare(index);
		timer = setTimeout(cycle, 14000);
	});
	timer = setTimeout(cycle, 500);
	raf = requestAnimationFrame(tick);
	stopTitle = () => { stopped = true; clearTimeout(timer); cancelAnimationFrame(raf); };
}








let startMode = q.get('mode') === 'story' ? 1 : q.get('mode') === 'sandbox' ? (q.get('map') === 'env_test' ? 3 : 2) : 0;
let startModeWord = null, startCommitted = false, pickingMap = false, waitingChoice = false;
const ACTS = {
	back: ['Back', 'Backspace', ['Backspace']],
	map5: ['GTA V Map', '5', ['Digit5', 'Numpad5']],
	map6: ['GTA VI Map', '6', ['Digit6', 'Numpad6']],
	sandbox: ['Sandbox Mode', 'Space', ['Space']],
	story: ['Story Mode', 'Enter', ['Enter', 'NumpadEnter']],
};
const LOADING = { 1: 'Loading Story Mode', 2: 'Loading Sandbox Mode: GTA V Map', 3: 'Loading Sandbox Mode: GTA VI Map' };
const modesEl = document.getElementById('modes'), modeButtons = [...modesEl.querySelectorAll('button')];
const isMode = (act) => act === 'story' || act === 'sandbox';
const showModes = () => {
	for (const b of modeButtons) {
		const act = b.dataset.act, loading = !pickingMap && (act === 'story' ? startMode === 1 : act === 'sandbox' && startMode >= 2);
		const text = document.createElement('span'), icon = document.createElement(loading ? 'i' : 'span');
		text.textContent = loading ? LOADING[startMode] : ACTS[act][0];
		icon.className = loading ? 'ls-spin' : 'ls-key';
		icon.textContent = loading ? '' : ACTS[act][1];
		b.replaceChildren(text, icon);
		b.style.order = loading ? 1 : 0;
		b.disabled = startCommitted;
		b.hidden = startCommitted ? !loading : pickingMap === isMode(act);
		b.classList.toggle('chosen', loading);
	}
	if (startMode) modesEl.classList.remove('ask');
	if (waitingChoice && !startMode) document.getElementById('label').textContent = pickingMap ? 'Choose a map to continue' : 'Choose Story Mode or Sandbox Mode to continue';
};
const choose = (m) => {
	pickingMap = false;
	if (m !== startMode) {
		startMode = m;
		if (startModeWord) Atomics.store(startModeWord, 0, m);
		postLog('[page] start mode: ' + ({ 1: 'story', 2: 'sandbox', 3: 'sandbox on env_test' })[m]);
	}
	showModes();
};
const act = (a) => {
	if (startCommitted) return;
	if (a === 'story') choose(1);
	else if (a === 'map5') choose(2);
	else if (a === 'map6') choose(3);
	else { pickingMap = a === 'sandbox'; showModes(); }
};



const GFX = [
	['textureQuality', 'Texture quality', 0, 5, 2],
	['shadowQuality', 'Shadow quality', -1, 5, 2],
	['reflectionQuality', 'Reflection quality', 0, 5, 2],
	['particleQuality', 'Particle quality', 0, 5, 2],
	['grassQuality', 'Grass quality', 0, 5, 2],
	['cityDensity', 'City density', 0, 5, 3],
	['lodScale', 'LOD scale', 0, 3, 2],
	['pedVariety', 'Ped variety', 0, 3, 2],
	['vehicleVariety', 'Vehicle variety', 0, 3, 2],
	['frameLimit', 'FPS cap', 0, 2, 1],
];
const gfxPanel = document.getElementById('gfx-panel'), gfxToggle = document.getElementById('gfx-toggle');
const gfxRows = document.getElementById('gfx-rows');
const gfxValues = {};

const GFX_STORE = 'playgta5-gfx';
let gfxSaved = {};
try { gfxSaved = JSON.parse(localStorage.getItem(GFX_STORE)) || {}; } catch (e) { gfxSaved = {}; }

const gfxSave = () => { try { localStorage.setItem(GFX_STORE, JSON.stringify({ ...gfxSaved, ...gfxValues })); } catch (e) {                               } };
for (const [key, title, min, max, def] of GFX) {
	const fromQ = q.get(key);

	let last = '', total = 0;
	new BroadcastChannel('game-debug').onmessage = (ev) => { last = ev.data.last; total = ev.data.total; render(); };
	const render = () => { const n = Atomics.load(dbg, 0); panel.textContent = 'DRAW ISOLATION  limit ' + (n < 0 ? 'off (all)' : n) + ' of ' + total + ' draws/frame   [F1 -1  F2 +1  F3 -25  F4 +25  F5 all  F6 log]\nlast draw run: ' + (last || '-'); };
	addEventListener('keydown', (e) => {
		const step = { F1: -1, F2: 1, F3: -25, F4: 25 }[e.code];
		if (step !== undefined) {
			const n = Atomics.load(dbg, 0);
			Atomics.store(dbg, 0, Math.max(0, Math.min(total, (n < 0 ? total : n) + step)));
			e.preventDefault(); render();
		} else if (e.code === 'F5' && !e.ctrlKey) { Atomics.store(dbg, 0, -1); e.preventDefault(); render(); }
		else if (e.code === 'F6') { postLog('[debug draw] limit ' + Atomics.load(dbg, 0) + ' of ' + total + ' | ' + last); e.preventDefault(); }
	}, { capture: true });
	render();
}

function installInput(memory, block) {
	if (q.get('dbg')) installDebugPanel(memory, block);
	const keys = new Uint8Array(memory.buffer, block, 256);
	const w = new Int32Array(memory.buffer, block + 256, 10);
	const U16 = new Uint16Array(memory.buffer, block + 256 + 40, 64);
	const MX = 0, MY = 1, DX = 2, DY = 3, DZ = 4, BTN = 5, FOCUS = 6, LOCKED = 7, HEAD = 8, TAIL = 9;
	let W = startSize[0], H = startSize[1];
	const ext = new Int32Array(memory.buffer, block + 424, 4);
	startModeWord = new Int32Array(memory.buffer, block + 440, 1);
	if (startMode) Atomics.store(startModeWord, 0, startMode);
	Atomics.store(ext, 2, W); Atomics.store(ext, 3, H);
	if (!q.get('fixed')) {
		let timer = 0;
		addEventListener('resize', () => {
			clearTimeout(timer);
			timer = setTimeout(() => {
				const [w, h] = wantSize();
				if (w === W && h === H) return;
				W = w; H = h;
				Atomics.store(ext, 2, w); Atomics.store(ext, 3, h);
				trace('window resized: back buffer ' + w + 'x' + h);
			}, 150);
		});
	}
	Atomics.store(w, FOCUS, document.hasFocus() ? 1 : 0);
	Atomics.store(w, MX, W >> 1);
	Atomics.store(w, MY, H >> 1);


	let traced = 0;
	const trace = (msg) => { if (traced < 80) { traced++; postLog('[page input] ' + msg); } };
	const passThrough = (e) => e.code === 'F12' || e.code === 'F11' || (e.ctrlKey && e.shiftKey && (e.code === 'KeyI' || e.code === 'KeyJ')) || e.code === 'F5';


	const FLY_ALIAS = { KeyI: 'Numpad8', KeyK: 'Numpad2', KeyJ: 'Numpad4', KeyL: 'Numpad6', KeyU: 'Numpad7', KeyO: 'Numpad9' };
	const held = new Set();
	const syncFlyAlias = () => { for (const [src, target] of Object.entries(FLY_ALIAS)) Atomics.store(keys, VK[target], held.has(src) || held.has(target) ? 0x80 : 0); };
	addEventListener('keydown', (e) => {
		if (passThrough(e)) return;
		e.preventDefault();
		const vk = VK[e.code];
		if (!e.repeat) trace('keydown ' + e.code + ' vk=' + (vk || 'UNMAPPED') + ' hasFocus=' + document.hasFocus() + ' engineFocus=' + Atomics.load(w, FOCUS));
		if (vk) Atomics.store(keys, vk, 0x80);
		held.add(e.code); syncFlyAlias();
		if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
			const head = Atomics.load(w, HEAD);
			if (((head - Atomics.load(w, TAIL)) >>> 0) < 64) { U16[head & 63] = e.key.charCodeAt(0); Atomics.store(w, HEAD, (head + 1) | 0); }
		} else if (e.code === 'Backspace' || e.code === 'Enter') {
			const head = Atomics.load(w, HEAD);
			if (((head - Atomics.load(w, TAIL)) >>> 0) < 64) { U16[head & 63] = e.code === 'Enter' ? 13 : 8; Atomics.store(w, HEAD, (head + 1) | 0); }
		}
	});
	addEventListener('keyup', (e) => {
		if (passThrough(e)) return;
		e.preventDefault();
		const vk = VK[e.code];
		if (vk) Atomics.store(keys, vk, 0);
		held.delete(e.code); syncFlyAlias();
	});
	const releaseAll = () => { held.clear(); for (let i = 0; i < 256; i++) Atomics.store(keys, i, 0); Atomics.store(w, BTN, 0); };
	addEventListener('focus', () => { trace('window focus'); Atomics.store(w, FOCUS, 1); });
	addEventListener('blur', () => { trace('window blur (all keys released)'); Atomics.store(w, FOCUS, 0); releaseAll(); });

	const locked = () => document.pointerLockElement === canvas;
	canvas.addEventListener('mousedown', (e) => {
		if (!locked()) { canvas.requestPointerLock({ unadjustedMovement: true }).catch(() => canvas.requestPointerLock()); }
		Atomics.or(w, BTN, 1 << [0, 2, 1, 3, 4][e.button]);
		e.preventDefault();
	});
	addEventListener('mouseup', (e) => { Atomics.and(w, BTN, ~(1 << [0, 2, 1, 3, 4][e.button])); });
	addEventListener('contextmenu', (e) => e.preventDefault());
	document.addEventListener('pointerlockchange', () => { trace('pointer lock ' + (locked() ? 'on' : 'off')); Atomics.store(w, LOCKED, locked() ? 1 : 0); });
	addEventListener('mousemove', (e) => {
		const r = canvas.getBoundingClientRect();
		if (locked()) {
			Atomics.add(w, DX, e.movementX);
			Atomics.add(w, DY, e.movementY);
			const x = Math.max(0, Math.min(W - 1, Atomics.load(w, MX) + e.movementX));
			const y = Math.max(0, Math.min(H - 1, Atomics.load(w, MY) + e.movementY));
			Atomics.store(w, MX, x);
			Atomics.store(w, MY, y);
		} else {
			const x = Math.max(0, Math.min(W - 1, Math.round((e.clientX - r.left) * W / r.width)));
			const y = Math.max(0, Math.min(H - 1, Math.round((e.clientY - r.top) * H / r.height)));
			Atomics.add(w, DX, x - Atomics.load(w, MX));
			Atomics.add(w, DY, y - Atomics.load(w, MY));
			Atomics.store(w, MX, x);
			Atomics.store(w, MY, y);
		}
	});


	let wheelAccum = 0;
	addEventListener('wheel', (e) => {
		e.preventDefault();
		wheelAccum += -e.deltaY / (e.deltaMode === 0 ? 100 : e.deltaMode === 1 ? 3 : 1);
		const n = Math.trunc(wheelAccum);
		if (n) { wheelAccum -= n; Atomics.add(w, DZ, n); }
	}, { passive: false });
}
</script>
